connectors:
  - name: Gmail
    why: Reply drafts for member emails land ready to send. You still press send.
    status: confirmed-official-example
    access: read-write
    use_policy: draft-only-use
    official_url: "https://support.claude.com/en/articles/10166901-use-google-workspace-connectors"
    fallback: "Paste or export only the messages needed for this task."
    verified_on: "2026-07-17"
  - name: Square
    why: The end-of-day close can add itself up from the day's sales and sign-ups instead of you reading numbers out.
    status: confirmed-official-example
    access: read-write
    use_policy: read-only-use
    official_url: "https://claude.com/connectors/square"
    fallback: "Export the dated sales or payment summary and place it in inbox/."
    verified_on: "2026-07-17"
  - name: Google Business Profile
    why: Keep hours and class info current, with review replies prepared for your yes. Posting stays your move.
    status: candidate-remote-mcp
    access: varies
    use_policy: draft-only-use
    fallback: "Paste the listing details or reviews needed for the draft."
    verified_on: "2026-07-17"
  - name: Instagram & Facebook
    why: No connection needed — Claude drafts your class posts and captions; you paste and post when you're happy.
    status: local-or-export-fallback
    access: none
    use_policy: not-connected
    fallback: "Copy an owner-approved draft into the social app yourself."
    verified_on: "2026-07-17"
